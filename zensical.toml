[project]
site_name = "Fractal Server"
site_url = "https://fractal-analytics-platform.github.io/fractal-server/"
repo_url = "https://github.com/fractal-analytics-platform/fractal-server"
repo_name = "fractal-analytics-platform/fractal-server"
extra_css = ["extra.css"]
copyright = """
Copyright 2026 (C) BioVisionCenter (University of Zurich) - see
<u><a href="https://github.com/fractal-analytics-platform/fractal-server/blob/main/LICENSE">LICENSE</a></u>.
"""

nav = [
    { "Home" = "index.md" },
    { "Usage" = [
        { "Install/deploy" = "install_and_deploy.md" },
        { "Configuration" = "configuration.md" },
        { "Integrations" = [
            "internals/integrations/index.md",
            "internals/integrations/runners.md",
            "internals/integrations/tasks.md",
        ]
        },
        { "Database" = "internals/database.md" },
        { "Logging" = "internals/logging.md" },
        { "Users" = "internals/users.md" },
        { "Data access" = "internals/data_access.md" },

    ]
    },
    { "Changelog" = "changelog.md" },
    { "Contributing" = "development.md" },
    { "Reference" = [
        { "API" = "openapi.md" },
        { "Code" = "code_reference/" },
        { "CLI" = "cli_reference.md" },
    ]},
]

[project.theme]
variant = "classic"
language = "en"
logo = "https://raw.githubusercontent.com/fractal-analytics-platform/fractal-logos/refs/heads/main/common/fractal_logo.png"
favicon = "https://raw.githubusercontent.com/fractal-analytics-platform/fractal-logos/refs/heads/main/common/fractal_favicon.png"
custom_dir = "docs/overrides"
navigation = {"expand" = true}

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
]


[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "green"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "gren"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.plugins.section-index]

[project.plugins.mkdocs-autoapi]
autoapi_dir = "fractal_server/"
autoapi_ignore = ["**/data_migrations/**", "**/migrations/**", "**/json_schemas/**"]
autoapi_root = "code_reference"

[project.plugins.mkdocstrings]

[project.plugins.mkdocstrings.handlers.python]
paths = ["fractal_server"]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://docs.pydantic.dev/latest/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
filters = []
group_by_category = true
show_category_heading = true
summary = true
backlinks = "tree"
docstring_style = "google"
docstring_section_style = "spacy"
show_source = true

parameter_headings = true
allow_inspection = true
show_symbol_type_heading = true
show_symbol_type_toc = false
signature_crossrefs = true
unwrap_annotated = true
show_attribute_values = true
inherited_members = true
extensions= ["griffe_pydantic"]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.blocks.caption = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
