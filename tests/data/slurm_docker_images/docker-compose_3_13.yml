services:
  slurm:
    cpus: 4.0
    mem_limit: 5g
    build:
      context: ./slurm
      dockerfile: Dockerfile
      args:
        - PYTHON_PATH=/.venv3.13/bin/python3.13
    hostname: slurm
    volumes:
      - '/tmp:/tmp:rw'
    # Required to run `apptainer` inside this container: relax seccomp and
    # AppArmor confinement (user namespaces, mounts) and expose `/dev/fuse`
    # (FUSE-mounting of SIF images). See
    # https://github.com/fractal-analytics-platform/fractal-containers/pull/186
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse
    environment:
      - SLURM_CPUS_ON_NODE=1
    ports:
      - '6817:6817'
      - '6818:6818'
