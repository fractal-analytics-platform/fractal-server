name: Create GitHub release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+[a-c][0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+alpha[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+beta[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+'


permissions: {}

jobs:
  create-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: gh release create "${GH_REF_NAME}" --draft --title "${GH_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REF_NAME: ${{ github.ref_name }}

  build:
    runs-on: ubuntu-latest
    needs: create-release-draft
    permissions:
      contents: write

    strategy:
      matrix:
        python-version: [skip]
        python-version-underscore: [skip]

        include:
          - python-version: "3.12"
            python-version-underscore: "3_12"
          - python-version: "3.13"
            python-version-underscore: "3_13"
          - python-version: "3.14"
            python-version-underscore: "3_14"
        exclude:
          - python-version: "skip"
            python-version-underscore: "skip"


    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      # Build and upload the wheel file only for a single Python version
      - run: uv build --verbose
        if: ${{ matrix.python-version == '3.14' }}

      - run: gh release upload "${GH_REF_NAME}" "dist/$WHEEL_FILENAME"
        if: ${{ matrix.python-version == '3.14' }}
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          WHEEL_FILENAME: "fractal_server-${{ github.ref_name }}-py3-none-any.whl"

      # Build and upload a pylock file for each Python version
      - run: uv export --frozen --format pylock.toml --no-group dev --no-group docs --no-emit-project --output-file "$PYLOCK_FILENAME"
        env:
          PYLOCK_FILENAME: "pylock.prod-${{ matrix.python-version-underscore }}.toml"
      - run: gh release upload "${GH_REF_NAME}" "$PYLOCK_FILENAME"
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PYLOCK_FILENAME: "pylock.prod-${{ matrix.python-version-underscore }}.toml"

  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: gh release edit "${GH_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REF_NAME: ${{ github.ref_name }}
