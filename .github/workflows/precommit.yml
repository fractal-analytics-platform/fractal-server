name: precommit and ty

on:
  push:
    branches: ["main", 'ihb-develop']
  pull_request:
    branches: ["main", 'ihb-develop']

permissions: {}

jobs:
  precommit-and-ty:
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest-known"
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --frozen

      # Pre-commit
      - run: uv add "pre-commit==4.6.0"
      - run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      # Experimental running of `ty`
      - run: uv add "ty==0.0.84"
      - run: uv run ty check ./fractal_server
        continue-on-error: true
