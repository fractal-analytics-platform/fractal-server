name: precommit and ty

on:
  push:
    branches: ["main", 'ihb-develop']
  pull_request:
    branches: ["main", 'ihb-develop']

permissions: {}

jobs:
  precommit-and-ty:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen

      # Pre-commit
      - run: uv add "pre-commit==4.6.0"
      - run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      # Experimental running of `ty`
      - run: uv add "ty==0.0.56"
      - run: uv run ty check ./fractal_server
        continue-on-error: true
