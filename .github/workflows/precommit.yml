name: precommit and ty

on:
  push:
    branches: ["main", 'ihb-develop']
  pull_request:
    branches: ["main", 'ihb-develop']

permissions: {}

jobs:
  precommit-and-ty:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen

      # Run pre-commit
      # NOTE: We run it as a standalone tool, because if we added it via `uv add` it
      # would pollute `uv.lock` and the command would fail.
      - run: uvx pre-commit@4.6.0 run --all-files --show-diff-on-failure --color=always

      # Experimental running of `ty`
      - run: uvx ty@0.0.56 check ./fractal_server
        continue-on-error: true
