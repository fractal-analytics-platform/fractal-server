name: uv audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 06 * * 3"

permissions: {}

jobs:
  uv_audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest-known"
          enable-cache: false
          python-version: "3.14"
      - run: uv audit --no-group dev --no-group docs --verbose
      - run: uv audit
        continue-on-error: true
