name: Build package

on:
  push:
    branches: ["main", 'ihb-develop']
  pull_request:
    branches: ["main", 'ihb-develop']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest-known"
          enable-cache: true
          python-version: "3.14"

      - run: uv build
