name: pip-install

on:
  push:
    branches: ["main", 'ihb-develop']
  pull_request:
    branches: ["main", 'ihb-develop']

permissions: {}

jobs:

  pip_install:

    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
        python-version: ["3.13", "3.14", "3.15"]

    name: "pip-install, Python ${{ matrix.python-version }}, ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    concurrency:
      # This makes a single `pip_install` job run at the time (per-GHA, per-ref),
      # while keeping up to 100 jobs in the queue.
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      queue: max

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e .

  run-remote-without-dependencies:
    name: "Run `remote.py` without dependencies"
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Setup an environment without dependencies, and make sure that `remote.py` does not raise import errors
      - run: pip install -e . --no-dependencies
      - run: python fractal_server/runner/executors/slurm_common/remote.py --input-file /tmp/in.json --output-file /tmp/out.json
